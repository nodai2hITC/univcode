function filterUniversities() {
  const inputs = this.value.trim().split(/[\s　]+/)
  const tableBody = document.getElementById("univ_table_body")
  tableBody.innerHTML = ""

  if (inputs.length == 1 && inputs[0] === "") return
  for (const [name, code] of univMap) {
    let flag = false
    for (const input of inputs) {
      if (!name.includes(input)) flag = true
    }
    if (flag) continue
    const row = document.createElement("tr")
    const nameCell = document.createElement("td")
    const codeCell = document.createElement("td")

    nameCell.textContent = name.replaceAll("|", " | ")
    codeCell.textContent = code

    row.appendChild(nameCell)
    row.appendChild(codeCell)
    tableBody.appendChild(row)
  }
}

document.addEventListener("DOMContentLoaded", (event) => {
  const univName = document.getElementById("univ_name")
  univName.addEventListener("input", filterUniversities)
